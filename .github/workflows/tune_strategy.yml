name: Tune GEAR/BBOZ Strategy Parameters

on:
  push:
    branches:
      - claude/gear-bboz-model-lnas-gql28g
    paths:
      - "scripts/tune.py"
      - ".github/workflows/tune_strategy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parameter sweep
        run: python scripts/tune.py

      - name: Commit tuning report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/tuning_report.json
          if git diff --quiet --staged -- scripts/tuning_report.json; then
            echo "No change in tuning_report.json, skipping commit."
            exit 0
          fi
          git commit -m "chore: update parameter tuning report [skip ci]"
          # The sweep can run long enough for another workflow (e.g. run_strategy.yml,
          # triggered by the same push) to have already pushed to this branch --
          # rebase onto whatever's there now rather than failing outright.
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" && git push && break
            echo "push/rebase attempt $i failed, retrying..."
            sleep 5
          done
